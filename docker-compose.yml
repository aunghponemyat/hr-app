services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hr_app
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_pass
      MYSQL_ROOT_PASSWORD: local_dev_root_password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mysql-test:
    image: mysql:8.0
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: hr_app_test
      MYSQL_USER: hr_test
      MYSQL_PASSWORD: hr_test_pass
      MYSQL_ROOT_PASSWORD: local_test_root_password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
