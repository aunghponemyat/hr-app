[tool.poetry]
name = "hr-app"
version = "0.1.0"
description = "HR management and attendance API"
authors = ["Aung Hpone Myat <aghonemyat@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }, { include = "scripts" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.142.2"
uvicorn = { version = ">=0.30,<1", extras = ["standard"] }
pydantic = ">=2.7,<3"
pydantic-settings = ">=2.2,<3"
sqlalchemy = ">=2.0,<3"
alembic = ">=1.13,<2"
pymysql = { version = ">=1.1,<2", extras = ["rsa"] }
pyjwt = ">=2.8,<3"
pwdlib = { version = ">=0.2,<1", extras = ["argon2"] }
geopy = ">=2.4,<3"
python-multipart = ">=0.0.18,<1"
pytest = { version = ">=8,<9", optional = true }
httpx = { version = ">=0.27,<1", optional = true }
ruff = { version = ">=0.9,<1", optional = true }
mypy = { version = ">=1.14,<2", optional = true }
types-PyMySQL = { version = ">=1.1", optional = true }

[tool.poetry.extras]
dev = ["pytest", "httpx", "ruff", "mypy", "types-PyMySQL"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
